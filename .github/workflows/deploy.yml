name: Deploy Prod

on:
  push:
    branches:
      - main

concurrency:
  group: rowset-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PROJECT_NAME: rowset
  CAPROVER_APP_NAME: rowset

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name and tags
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published platforms
        run: deployment/verify-image-platforms.sh "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.candidate_tag }}" linux/amd64 linux/arm64

      - name: Smoke published platforms
        run: deployment/smoke-image-platforms.sh "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.candidate_tag }}"

      - name: Verify anonymous candidate availability
        timeout-minutes: 15
        run: |
          deployment/verify-anonymous-image.sh \
            "${{ steps.build.outputs.digest }}" \
            "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.candidate_tag }}"

      - name: Log in to GHCR for tag promotion
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect immutable SHA tag
        run: |
          deployment/verify-immutable-image-tag.sh \
            "${{ steps.build.outputs.digest }}" \
            "${{ steps.image.outputs.image_name }}:${{ github.sha }}"

      - name: Promote advertised tags
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.image_name }}:${{ github.sha }}" \
            "${{ steps.image.outputs.image_name }}@${{ steps.build.outputs.digest }}"

      - name: Verify anonymous image availability
        timeout-minutes: 15
        run: |
          deployment/verify-anonymous-image.sh \
            "${{ steps.build.outputs.digest }}" \
            "${{ steps.image.outputs.image_name }}:${{ github.sha }}"

      - name: Deploy server to CapRover
        uses: caprover/deploy-from-github@v1.2.0
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ env.CAPROVER_APP_NAME }}
          token: ${{ secrets.APP_TOKEN }}
          image: ${{ steps.image.outputs.image_name }}:${{ github.sha }}

      - name: Deploy workers to CapRover
        uses: caprover/deploy-from-github@v1.2.0
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ env.CAPROVER_APP_NAME }}-workers
          token: ${{ secrets.WORKERS_APP_TOKEN }}
          image: ${{ steps.image.outputs.image_name }}:${{ github.sha }}

      - name: Notify IndexNow of public URL changes
        continue-on-error: true
        timeout-minutes: 5
        env:
          INDEXNOW_AFTER: ${{ github.sha }}
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_SITE_URL: https://rowset.app
        run: |
          if [[ -z "$INDEXNOW_KEY" ]]; then
            echo "INDEXNOW_KEY is not configured; skipping IndexNow notification."
            exit 0
          fi

          zero_sha="$(printf '0%.0s' {1..40})"
          if [[ -z "$INDEXNOW_BEFORE" || "$INDEXNOW_BEFORE" == "$zero_sha" ]]; then
            INDEXNOW_BEFORE="$zero_sha"
          elif ! git fetch --no-tags --depth=1 origin "$INDEXNOW_BEFORE"; then
            echo "::warning::Could not fetch the comparison commit; submitting the current sitemap."
            INDEXNOW_BEFORE="$zero_sha"
          fi

          python3 -m scripts.submit_indexnow \
            --site-url "$INDEXNOW_SITE_URL" \
            --before "$INDEXNOW_BEFORE" \
            --after "$INDEXNOW_AFTER"
